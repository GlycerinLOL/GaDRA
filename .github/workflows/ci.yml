name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only checks out + installs + lints + tests (no push / comment / release),
# so a read-only token is sufficient and removes the default write-token supply-chain surface.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (method-only — proves zero data/eval deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (method + dev ONLY — no datasets/evaluate/accelerate)
        run: |
          python -m pip install --upgrade pip
          # CPU torch pinned to the parity-golden version: the bit-exact layer goldens were captured on
          # torch 2.6.0; softplus (soft gate) drifts past atol=1e-6 on other torch builds. CPU wheel = fast.
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests examples

      - name: Pytest (package suite — method-only, deps-absent; wheel-purity gate runs here)
        run: pytest -q -m "not gpu" tests/

  reproduction:
    name: reproduction (repo-only examples/ tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (method + dev + reproduction tooling deps)
        run: |
          python -m pip install --upgrade pip
          # CPU torch 2.6.0 (parity-golden version); `.[dev]` brings pytest (requirements-repro has none).
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" -r requirements-repro.txt

      - name: Pytest (reproduction suite; G2/G3 source-gated tests skip without GADRA_SOURCE_REPO)
        run: pytest -q -m "not gpu" examples/tests/

  lock:
    name: uv.lock drift (the reproduction env is pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.5"

      - name: uv lock is in sync with pyproject.toml
        run: uv lock --check
