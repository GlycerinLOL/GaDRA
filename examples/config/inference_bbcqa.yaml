# BBC-QA (target benchmark) — GPT-judged "Correct %" (`python -m examples.inference --config <this>`).
# base + adapter come from the suite (inference.yaml) or `--override adapter=...`.
chat_template_path: examples/config/llama3.2-Instruct.jinja

task: bbcqa
eval_file: data/BBC_news_alltime/Finetuning/v2-subset_5587/v2_5587-test400.jsonl
documents_file: data/BBC_news_alltime/Pretraining/handwritten_5587.jsonl      # source articles for the GPT judge
use_raw_text: false                             # prompt built from `messages` via chat template
batch_size: 32
max_new_tokens: 256

# GPT judge (key from OPENAI_API_KEY env var):
gpt_model: gpt-4.1-mini
gpt_repeats: 1
gpt_vote_rate: 50
gpt_workers: 32                                 # parallel judge calls
