# GaDRA paper-repro inference suite (`python -m examples.inference --config <this>`).
# Set `adapter` once; all tasks in `tasks` are evaluated in a single job, model loaded once.

base: meta-llama/Llama-3.1-8B-Instruct
adapter: out/gadra-bbc            # set once; applied to every task below

# Benchmarks to run (add/remove freely). Each per-task config supplies eval_file + task knobs.
tasks:
  - examples/config/inference_bbcqa.yaml   # BBC QA (target)    — GPT-judged; needs OPENAI_API_KEY + documents_file
  - examples/config/inference_gsm8k.yaml   # GSM8K  (retention) — EM
  - examples/config/inference_mbpp.yaml    # MBPP   (retention) — pass@1
  - examples/config/inference_tiebe.yaml   # TiEBe  (retention) — GPT-judged; needs OPENAI_API_KEY

# GPT-judged tasks (bbcqa / tiebe) read OPENAI_API_KEY from the environment, never the repo.

# Eval JSONL field mapping:
#   prompt    : explicit `prompt` > `text` (use_raw_text) > `messages` (chat template) > `question`
#   reference : `messages[-1]`, or explicit `answer`/`answers`/`answer_list`
#   qa    -> char-F1/EM
#   gsm8k -> EM vs `answers`/`answer`
#   mbpp  -> `test` field (requires HF_ALLOW_CODE_EVAL=1)
#   bbcqa -> GPT judge; document from `documents_file` keyed by `id`, or explicit `document` field
#   tiebe -> GPT judge; question from `messages[-2]`, answer from `messages[-1]` or `answer`
