[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gadra"
version = "0.0.0.dev0"
description = "GaDRA (Gated Dual-conditioned Residual Adapter) as a HuggingFace peft-native custom tuner"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "GlycerinLOL" }]
keywords = ["peft", "lora", "adapter", "parameter-efficient-fine-tuning", "llm"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# peft==0.16.0 pinned: gadra._register enum-extension verified against this version.
dependencies = [
    "torch>=2.1",
    "transformers==4.53.3",
    "peft==0.16.0",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/GlycerinLOL/GaDRA"
Repository = "https://github.com/GlycerinLOL/GaDRA"
Issues = "https://github.com/GlycerinLOL/GaDRA/issues"

# Installable package = method only. Reproduction deps live in [dependency-groups] (uv-local, not in wheel metadata).
[project.optional-dependencies]
# wheel: required by tests/test_wheel_purity.py to build the wheel in the deps-absent CI job.
dev = ["pytest>=8", "ruff>=0.5", "wheel>=0.42"]

# PEP 735 dependency-groups: resolved into uv.lock, never written into published wheel metadata.
[dependency-groups]
gpu = [
    "datasets>=2.18",
    "evaluate>=0.4",
    "accelerate>=0.30",
    "deepspeed>=0.17",
    "pyyaml>=6",
    "openai>=1.0",                  # GPT judge for bbcqa / tiebe (key from OPENAI_API_KEY env)
    # Prebuilt FA2 wheel; cp312/torch2.6/cu12 only (gated by marker).
    "flash-attn==2.7.4.post1 ; python_version == '3.12' and sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["src"]

# uv project config (uv-only; never reaches published wheel metadata).
[tool.uv]
default-groups = []                                        # bare `uv sync` = method only; GPU env needs `--group gpu`
constraint-dependencies = ["torch==2.6.0"]                 # pinned to FA2-wheel ABI (cu124/torch2.6/cxx11abiFALSE)
no-build-isolation-package = ["flash-attn"]

# cu124 PyTorch index: consulted only for packages routed via [tool.uv.sources].
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
# Dao-AILab prebuilt FA2 wheel (cp312/torch2.6/cu12/cxx11abiFALSE); no source build required.
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp312-cp312-linux_x86_64.whl", marker = "python_version == '3.12' and sys_platform == 'linux'" }

[tool.ruff]
line-length = 200

[tool.pytest.ini_options]
# Default: method-only suite. Reproduction suite: `pytest examples/tests/`.
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "parity: numeric parity tests vs the original GaDRA implementation",
    "gpu: requires CUDA",
]
